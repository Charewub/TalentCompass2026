function assessUI(){const a=cur();if(!a||!scope(a))return `<div class="card">Access denied</div>`;if(!canEdit(a))return resultUI();const q=Q[qindex],dim=D.find(d=>d.id===q.domain);const ans=a.answers[q.id]||{};const count=a.people.filter(p=>ans[p.id]>=1&&ans[p.id]<=3).length;return `<div class="pagehead"><div><p class="eyebrow">ASSESSMENT · ${esc(a.id)}</p><h1>ประเมินพฤติกรรม</h1><p class="muted">${a.path==='manager'?'Supervisor → Manager':'Manager → Director'} · ${esc(a.department)}</p></div><button class="btn small" data-go="home">← My Assessments</button></div><section class="card"><div class="progresshead"><span class="tiny muted">Question ${qindex+1} of 30 · ${esc(dim.id)} ${esc(dim.name)}</span><span class="pill DRAFT">${esc(saveState||'Saved · Demo')}</span></div><div class="pbar"><span style="width:${completed(a)/30*100}%"></span></div><p class="tiny muted" style="margin:15px 0 4px">${esc(q.dimension)} · ${esc(dim.desc)}</p><h2 style="font-size:19px;line-height:1.55;margin-bottom:10px">${esc(q.text)}</h2><p class="tiny muted">โปรดให้คะแนนพนักงานทุกคนจากพฤติกรรมที่สังเกตได้จริง สามารถให้คะแนนเดียวกันหลายคนได้</p><details style="margin:13px 0;font-size:12px;color:#596274"><summary>แนวทางหลักฐานสำหรับ ${a.path==='manager'?'Manager':'Director'} Role</summary><p style="margin-top:7px">${esc(dim.lens[a.path])}</p></details>${a.people.map(p=>`<div class="rating"><b>${esc(p.name)}</b><div class="choices">${[[3,'โดดเด่นสม่ำเสมอ'],[2,'ตรงตามมาตรฐาน'],[1,'บางสถานการณ์']].map(([v,t])=>`<button class="choice ${ans[p.id]===v?'sel':''}" data-rate="${p.id}" data-value="${v}" aria-pressed="${ans[p.id]===v}">${t}</button>`).join('')}</div></div>`).join('')}<p class="tiny muted">ตอบแล้ว ${count} / ${a.people.length} คน ในข้อนี้ · รวม ${completed(a)} / 30 ข้อ</p></section><div class="stickyfoot"><div class="between"><button class="btn" data-prev ${qindex===0?'disabled':''}>← ก่อนหน้า</button><div class="actions"><button class="btn soft small" data-go="home">บันทึกและออก</button><button class="btn primary" data-next ${count!==a.people.length?'disabled':''}>${qindex===29?'ดูผลลัพธ์ →':'ข้อถัดไป →'}</button></div></div></div>`}
function mapUI(a){return `<div class="between" style="margin-bottom:13px"><div><h2>ภาพรวม 9-Box</h2><p class="tiny muted">Performance → · Potential ↑</p></div>${canCal(a)?`<button class="btn small soft" data-calopen>✎ Calibration</button>`:''}</div><div class="nine"><div></div>${['Low','Moderate','High'].map(x=>`<span class="mapaxis">${x}</span>`).join('')}${[2,1,0].map(y=>`<div class="maprowlab">${label(y)}</div>${[0,1,2].map(x=>`<div class="mapcell tone-${x}${y}"><span class="cellname">${group(x,y)}</span>${a.people.filter(p=>{let r=finalFor(a,p);return r.x===x&&r.y===y}).map(p=>`<span class="mapchip">${esc(p.name)} ${a.calibration[p.id]?'✓':''}</span>`).join('')}${a.proposals.filter(v=>v.status==='PENDING'&&v.px-1===x&&v.py-1===y).map(v=>`<span class="mapchip pending">✎ ${esc(a.people.find(p=>p.id===v.personId)?.name||'')} (เสนอ)</span>`).join('')}</div>`).join('')}`).join('')}</div><p class="tiny muted" style="margin-top:10px">สีแสดงกลุ่มตามต้นแบบ · ⓘ ผลที่ไม่ได้รับการอนุมัติยังเป็น Provisional</p>`}
function resultUI(){const a=cur();if(!a||!scope(a))return '<div class="card">Access denied</div>';if(completed(a)<30)return `<div class="card"><h2>ยังตอบไม่ครบ</h2><p class="muted">${completed(a)}/30 ข้อ</p><button class="btn primary" data-resume="${a.id}">ทำต่อ</button></div>`;return `<div class="pagehead"><div><p class="eyebrow">TALENT RESULTS · ${esc(a.id)}</p><h1>Talent 9-Box</h1><p class="muted">${a.path==='manager'?'Supervisor → Manager':'Manager → Director'} · ${a.people.length} คน</p></div><div class="actions">${textStatus(a.status)}<button class="btn small" data-go="home">← My Assessments</button></div></div><div class="grid cols2" style="align-items:start"><section class="card">${mapUI(a)}<div class="notice" style="margin-top:15px">Initial 9-Box เป็น Provisional จนกว่าผลจะผ่าน Approval</div>${canEdit(a)?`<div class="actions" style="margin-top:14px"><button class="btn" data-resume="${a.id}">แก้คำตอบ</button><button class="btn primary" data-submit>Submit Assessment →</button></div>`:''}${canReview(a)?`<div class="actions" style="margin-top:14px"><button class="btn" data-return>ส่งคืน HOD</button><button class="btn primary" data-hrreview>เข้าสู่ HR Review / Calibration →</button></div>`:''}${canCal(a)?`<div class="actions" style="margin-top:14px"><button class="btn primary" data-calopen>✎ เสนอ Calibration</button><button class="btn" data-sendapproval>ส่งให้ผู้อนุมัติ →</button></div>`:''}${canApprove(a)?`<div class="actions" style="margin-top:14px"><button class="btn primary" data-approve>Approve Final Result</button><button class="btn" data-reject>ส่งกลับ Calibration</button></div>`:''}</section><section class="card"><div class="between"><h2>Individual Talent Profiles</h2><span class="tiny muted">${a.people.length} people</span></div>${a.people.map(p=>{const f=finalFor(a,p);let proposal=a.proposals.find(v=>v.personId===p.id&&v.status==='PENDING');return `<div class="personcard"><div class="between"><div><b>${esc(p.name)}</b><p class="tiny muted">${esc(p.empId)}</p></div><span class="pill">${group(f.x,f.y)}</span></div><div class="grid cols2" style="margin-top:12px"><div class="note">Performance <div class="score">${f.sc.px.toFixed(2)}</div><span class="tiny">${label(f.x)}</span></div><div class="note">Potential <div class="score">${f.sc.py.toFixed(2)}</div><span class="tiny">${label(f.y)}</span></div></div><details style="margin-top:12px"><summary class="tiny">ดูคะแนน 6 Domains</summary>${D.map(d=>`<div class="domain"><span class="tiny" style="width:115px">${esc(d.name)}</span><div class="bar"><span style="width:${((f.sc.domains[d.id]-1)/2)*100}%"></span></div><b>${f.sc.domains[d.id].toFixed(2)}</b></div>`).join('')}</details>${proposal?`<p class="info" style="margin-top:12px">Pending change: ${group(proposal.px-1,proposal.py-1)}</p>`:''}${f.adjusted?`<p class="tiny" style="color:#267443;margin-top:7px">✓ Calibrated & Approved</p>`:''}</div>`}).join('')}</section></div><div class="card" style="margin-top:17px"><div class="between"><h2>Workflow & Audit Snapshot</h2><button class="btn small" data-go="audit">Audit History</button></div><p class="muted tiny">Revision ${a.revision} · Last updated ${pretty(a.updated)} · Question Bank ${a.bankVersion}</p>${a.proposals.map(v=>`<div class="audit"><time>${pretty(v.date)}</time><div>Calibration ${v.status}: <b>${esc(a.people.find(p=>p.id===v.personId)?.name)}</b> → ${group(v.px-1,v.py-1)}<div class="muted">${esc(v.reason)}</div></div></div>`).join('')||'<p class="muted tiny">ยังไม่มี Calibration Records</p>'}</div>`}
function inboxUI(){const cases=db.assessments.filter(a=>scope(a)&&!['DRAFT','ARCHIVED'].includes(a.status));return `<div class="pagehead"><div><p class="eyebrow">WORKFLOW / REVIEW</p><h1>Review Queue</h1><p class="muted">แสดงเฉพาะรายการที่ผู้ใช้มีสิทธิ์เข้าถึง</p></div><button class="btn" data-go="home">← กลับ</button></div><div class="card"><div class="note">สิทธิ์ปัจจุบัน: <b>${esc(me().role)}</b> · เปลี่ยน Demo User ที่ปุ่มบัญชี เพื่อทดลอง workflow แต่ละบทบาท</div>${cases.map(a=>`<div class="listcard"><div class="listtop"><div><b>${esc(a.id)}</b><p class="tiny muted">${a.path==='manager'?'Supervisor → Manager':'Manager → Director'} · ${a.people.length} nominees</p></div>${textStatus(a.status)}</div><div class="actions" style="margin-top:12px"><button class="btn small primary" data-goresult="${a.id}">ดูผล / ดำเนินการ →</button></div></div>`).join('')||'<p class="muted" style="margin-top:15px">ไม่พบรายการ</p>'}</div>`}
function auditUI(){let events=db.events.filter(ev=>!ev.assessment||db.assessments.some(a=>a.id===ev.assessment&&scope(a)));return `<div class="pagehead"><div><p class="eyebrow">AUDIT TRAIL</p><h1>History & Changes</h1><p class="muted">ทุกการเปลี่ยนสถานะและ Calibration Proposal ถูกบันทึกสำหรับ Demo</p></div><button class="btn" data-go="home">← กลับ</button></div><div class="card">${events.map(e=>`<div class="audit"><time>${pretty(e.when)}</time><div><b>${esc(e.action)}</b> · ${esc(e.assessment)} · ${esc(e.by)}<p class="tiny muted">${esc(e.detail)}</p></div></div>`).join('')}</div>`}
function modalUI(){if(!modal)return '';if(modal.type==='account')return `<div class="modalmask" data-dismiss><div class="modal" role="dialog" aria-modal="true"><div class="between"><h2>Demo Users & Roles</h2><button class="btn small" data-close>✕</button></div><p class="muted tiny">บัญชีตัวอย่างสำหรับสาธิตบทบาท HOD / HRBP / Panel / CEO Approver (ไม่ใช่การเข้าสู่ระบบ Google จริง)</p><div class="stack" style="margin-top:15px">${USERS.map(u=>`<button class="btn" style="text-align:left;${u.id===sessionUser?'border-color:#d71920;background:#fff0f1':''}" data-user="${u.id}"><b>${esc(u.name)}</b><br><span class="tiny muted">${esc(u.role)} · ${esc(u.email)}</span></button>`).join('')}</div><hr class="hrline"><div class="actions"><button class="btn small" data-exportcsv>ดาวน์โหลด CSV</button><button class="btn small" data-exportjson>ดาวน์โหลด JSON</button></div><p class="tiny muted" style="margin-top:8px">ส่งออกเฉพาะรายการที่บัญชี Demo นี้มีสิทธิ์ดู</p><hr class="hrline"><button class="btn soft block" data-resetdemo>↻ Reset demo data</button></div></div>`;
if(modal.type==='cal'){let a=cur();return `<div class="modalmask" data-dismiss><div class="modal" role="dialog" aria-modal="true"><div class="between"><h2>✎ Talent Calibration</h2><button class="btn small" data-close>✕</button></div><p class="muted tiny">เสนอปรับตำแหน่ง 9-Box · ต้องระบุเหตุผลประกอบ</p><div class="stack" style="margin-top:14px"><div class="field"><label>พนักงาน</label><select id="calPerson">${a.people.map(p=>`<option value="${p.id}" ${modal.person===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="grid cols2"><div class="field"><label>Performance</label><select id="calPX">${[1,2,3].map((v)=>`<option value="${v}" ${modal.px===v?'selected':''}>${label(v-1)}</option>`).join('')}</select></div><div class="field"><label>Potential</label><select id="calPY">${[1,2,3].map((v)=>`<option value="${v}" ${modal.py===v?'selected':''}>${label(v-1)}</option>`).join('')}</select></div></div><div class="field"><label>เหตุผลและหลักฐานประกอบ *</label><textarea id="calReason" placeholder="อธิบายหลักฐานเชิงพฤติกรรม หรือ PMS"></textarea></div><div class="info">การบันทึกเป็น Proposal เท่านั้น ผลที่ยืนยันแล้วจะเปลี่ยนหลัง Approver อนุมัติ</div><div class="actions"><button class="btn" data-close>ยกเลิก</button><button class="btn primary" data-savecal>บันทึก Proposal</button></div></div></div></div>`}return ''}
function create(){const names=[...document.querySelectorAll('.pname')].map(x=>x.value.trim());const ids=[...document.querySelectorAll('.pid')].map(x=>x.value.trim());if(names.length<3||names.length>5||names.some(x=>!x)||new Set(names.map(n=>n.toLowerCase())).size!==names.length)return fail('กรุณากรอกชื่อ 3–5 คนไม่ซ้ำกัน');const id='ASM-'+String(Math.floor(Date.now()%1000000));const a={id,owner:sessionUser,department:$('#newDep').value.trim(),period:$('#newPeriod').value.trim(),path:$('#newPath').value,status:'DRAFT',people:names.map((name,i)=>({id:id+'-N'+(i+1),name,empId:ids[i]||'DEMO-'+String(i+1).padStart(3,'0')})),answers:{},revision:1,updated:now(),calibration:{},proposals:[],bankVersion:'v2.1',scoringVersion:'v1'};if(!a.department||!a.period)return fail('กรุณากรอกหน่วยงานและรอบการประเมิน');db.assessments.unshift(a);log(a,'CREATE','Created new Draft');persist();qindex=0;go('assess',a.id)}
function assign(person,value){const a=cur();if(!canEdit(a))return fail('ไม่มีสิทธิ์แก้ไข');let q=Q[qindex];a.answers[q.id]??={};a.answers[q.id][person]=value;upd(a,'AUTOSAVE',`${q.id} · ${person} = ${value}`);saveState='Saved locally · '+new Date().toLocaleTimeString('th-TH');render();toast('บันทึกคำตอบแล้ว (Demo)')}
function changeStatus(a,status,action,detail){a.status=status;upd(a,action,detail);render();toast('Status: '+ST[status])}
function doSubmit(){const a=cur();if(!canEdit(a)||completed(a)!==30)return fail('ยังตอบไม่ครบหรือไม่มีสิทธิ์');changeStatus(a,'SUBMITTED','SUBMIT','HOD submitted assessment')}
function doCal(){let a=cur();if(!canCal(a))return fail('ไม่มีสิทธิ์ Calibration');const p=$('#calPerson').value,px=Number($('#calPX').value),py=Number($('#calPY').value),reason=$('#calReason').value.trim();if(reason.length<8)return fail('กรุณาระบุเหตุผลอย่างน้อย 8 ตัวอักษร');a.proposals=a.proposals.filter(v=>!(v.personId===p&&v.status==='PENDING'));a.proposals.push({id:'CAL-'+Math.random().toString(36).slice(2,7),personId:p,px,py,reason,by:sessionUser,date:now(),status:'PENDING'});a.status='CALIBRATION';upd(a,'CALIBRATION_PROPOSED',`Person ${p} → ${px}/${py}; ${reason}`);modal=null;render();toast('บันทึกข้อเสนอ Calibration แล้ว')}
function doApprove(){let a=cur();if(!canApprove(a))return fail('ไม่มีสิทธิ์อนุมัติ');for(const p of a.proposals.filter(v=>v.status==='PENDING')){a.calibration[p.personId]={px:p.px,py:p.py,reason:p.reason,approvedBy:sessionUser};p.status='APPROVED';p.approvedAt=now()}changeStatus(a,'APPROVED','APPROVE','Final 9-Box approved')}
function downloadFile(filename,mime,data){const b=new Blob([data],{type:mime}),url=URL.createObjectURL(b),l=document.createElement('a');l.href=url;l.download=filename;l.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function exportCSV(){let arr=[['Assessment ID','Pathway','Status','Employee ID','Name','Performance','Potential','Original 9-Box','Final 9-Box']];db.assessments.filter(scope).forEach(a=>{if(completed(a)<30)return;a.people.forEach(p=>{let s=score(a,p),f=finalFor(a,p);arr.push([a.id,a.path,a.status,p.empId,p.name,s.px.toFixed(4),s.py.toFixed(4),group(lev(s.px),lev(s.py)),group(f.x,f.y)])})});let csv=arr.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');downloadFile('talent_compass_poc_results.csv','text/csv;charset=utf-8','\uFEFF'+csv)}
function hiddenMenu(){modal={type:'account'};render()}
document.addEventListener('click',e=>{const el=e.target.closest('button');if(e.target.matches('[data-dismiss]')){modal=null;render();return}if(!el)return;const d=el.dataset;if('close'in d){modal=null;render();return}if(d.go){go(d.go);return}if(d.user){sessionUser=d.user;modal=null;go('home');return}if('exportcsv'in d){exportCSV();return}if('exportjson'in d){downloadFile('talent_compass_poc_data.json','application/json;charset=utf-8',JSON.stringify({assessments:db.assessments.filter(scope),audit:db.events.filter(ev=>!ev.assessment||db.assessments.some(a=>a.id===ev.assessment&&scope(a)))},null,2));return}if('resetdemo'in d){if(confirm('Reset ข้อมูลตัวอย่างทั้งหมด?')){db=seed();sessionUser='hod';modal=null;go('home')}return}if(d.open){const a=db.assessments.find(a=>a.id===d.open);if(!scope(a))return fail('Access denied');qindex=Q.findIndex(q=>!a.people.every(p=>[1,2,3].includes(a.answers[q.id]?.[p.id])));if(qindex<0)qindex=29;go(canEdit(a)&&completed(a)!==30?'assess':'result',a.id);return}if(d.goresult){go('result',d.goresult);return}if('addperson'in d){if(document.querySelectorAll('.pname').length>=5)return;const n=document.querySelectorAll('.pname').length+1;$('#personInputs').insertAdjacentHTML('beforeend',`<div class="grid cols2"><div class="field"><label>พนักงาน ${n}</label><input class="pname" placeholder="ชื่อ–สกุล"></div><div class="field"><label>Employee ID (optional)</label><input class="pid" placeholder="EMP00${n}"></div></div>`);return}if('removeperson'in d){if(document.querySelectorAll('.pname').length>3)$('#personInputs').lastElementChild.remove();return}if('create'in d)return create();if(d.resume){let a=db.assessments.find(a=>a.id===d.resume);if(!canEdit(a))return fail('ไม่มีสิทธิ์');qindex=0;go('assess',a.id);return}if(d.rate){assign(d.rate,Number(d.value));return}if('prev'in d){qindex=Math.max(0,qindex-1);render();return}if('next'in d){const a=cur(),q=Q[qindex];if(!a.people.every(p=>[1,2,3].includes(a.answers[q.id]?.[p.id])))return fail('กรุณาประเมินทุกคน');if(qindex===29){go('result',a.id)}else{qindex++;render();window.scrollTo(0,0)}return}if('submit'in d)return doSubmit();if('hrreview'in d){let a=cur();if(!canReview(a))return fail('ไม่มีสิทธิ์');changeStatus(a,'HR_REVIEW','HR_REVIEW','HR accepted submitted assessment for review');return}if('return'in d){let a=cur();if(!canReview(a))return fail('ไม่มีสิทธิ์');let reason=prompt('เหตุผลการส่งคืน (Demo):');if(reason)changeStatus(a,'RETURNED','RETURN',reason);return}if('calopen'in d){let a=cur();if(!canCal(a))return fail('ไม่มีสิทธิ์');const p=a.people[0],f=finalFor(a,p);modal={type:'cal',person:p.id,px:f.x+1,py:f.y+1};render();return}if('savecal'in d)return doCal();if('sendapproval'in d){let a=cur();if(!canCal(a))return fail('ไม่มีสิทธิ์');changeStatus(a,'PENDING_APPROVAL','SEND_APPROVAL','Submitted calibration to approver');return}if('approve'in d)return doApprove();if('reject'in d){let a=cur();if(!canApprove(a))return fail('ไม่มีสิทธิ์');let why=prompt('เหตุผลส่งกลับ Calibration:');if(why)changeStatus(a,'CALIBRATION','REJECT',why);return}});
